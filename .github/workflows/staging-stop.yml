name: Staging stop

on:
  schedule:
    - cron: "0 21 * * *" # 23:00 Prague summer time — staging is off overnight to save money
  workflow_dispatch: {}

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Stop staging server
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
        run: aws ec2 stop-instances --instance-ids "${{ secrets.STAGING_INSTANCE_ID }}"
